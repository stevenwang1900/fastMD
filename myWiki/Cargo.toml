[package]
name = "md-editor-tauri"
version = "1.0.0"
description = "A fast Markdown editor built with Tauri"
authors = ["MD Editor Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/md-editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
