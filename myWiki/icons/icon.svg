<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d3d5a"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- M letter -->
  <text x="512" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="480" font-weight="700" fill="#ffffff" text-anchor="middle">M</text>
  
  <!-- Markdown underline -->
  <rect x="280" y="680" width="464" height="24" rx="12" fill="#7c3aed"/>
  
  <!-- Small markdown hint -->
  <rect x="680" y="780" width="120" height="16" rx="8" fill="#6366f1" opacity="0.6"/>
</svg>